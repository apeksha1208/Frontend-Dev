<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-front">
                <img src="https://via.placeholder.com/300x200" alt="Card Image">
                <h2>Front Title</h2>
            </div>
            <div class="card-back">
                <h2>Back Title</h2>
                <p>This is the back side of the card. It contains additional information and details about the content displayed on the front.</p>
            </div>
        </div>
    </div>
</body>
</html>
