<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Video Embed</title>
  </head>
  <body>
    <h1>YouTube Video Embed</h1>

    <!-- YouTube video embedded using iframe with percentage values for responsive design -->
    <iframe
      width="80%"
      height="60%"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    >
    </iframe>

    <p>
      This video will adjust its size when the browser window is resized due to
      the percentage-based width and height values.
    </p>
  </body>
</html>
