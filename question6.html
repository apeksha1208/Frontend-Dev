<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="question6.css">
</head>
<body>
    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see the transformation effect</p>
    </header>
    
    <main>
        <section class="transformations-section">
            <div class="transform-container">
                <!-- Rotate transformation -->
                <div class="transform-box rotate-box">
                    <div class="box-content">ROTATE</div>
                </div>
                <p class="label">rotate(45deg)</p>
            </div>
            
            <div class="transform-container">
                <!-- Scale transformation -->
                <div class="transform-box scale-box">
                    <div class="box-content">SCALE</div>
                </div>
                <p class="label">scale(1.3)</p>
            </div>
            
            <div class="transform-container">
                <!-- Translate transformation -->
                <div class="transform-box translate-box">
                    <div class="box-content">TRANSLATE</div>
                </div>
                <p class="label">translate(30px, 30px)</p>
            </div>
            
            <div class="transform-container">
                <!-- Skew transformation -->
                <div class="transform-box skew-box">
                    <div class="box-content">SKEW</div>
                </div>
                <p class="label">skew(20deg, 10deg)</p>
            </div>
        </section>
    </main>
    
    <footer>
        <p>CSS Transformations Showcase - CSS Practice</p>
    </footer>
</body>
</html>
