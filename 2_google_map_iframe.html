<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Map Embed</title>
  </head>
  <body>
    <h1>Google Map - New York City</h1>

    <!-- Google Map embedded using iframe with loading attribute -->
    <!-- The loading="lazy" attribute defers loading of the iframe until it's needed, improving page performance -->
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.2156!2d-74.0059!3d40.7128!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a21e3e4d9d9%3A0x9b70f4fd4e8b6489!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sus!4v1234567890123!5m2!1sen!2sus"
      width="100%"
      height="400"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="New York City Map"
    >
    </iframe>

    <p>
      This map shows New York City. The loading="lazy" attribute helps improve
      page performance by only loading the map when it's about to come into
      view.
    </p>
  </body>
</html>
