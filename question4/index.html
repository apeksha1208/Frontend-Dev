<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Dashboard</h1>
        </header>
        
        <aside class="sidebar">
            <nav>
                <a href="#dashboard">Dashboard</a>
                <a href="#analytics">Analytics</a>
                <a href="#reports">Reports</a>
                <a href="#settings">Settings</a>
            </nav>
        </aside>
        
        <main class="content">
            <div class="box box1">
                <h3>Box 1</h3>
                <p>Content area 1</p>
            </div>
            <div class="box box2">
                <h3>Box 2</h3>
                <p>Content area 2</p>
            </div>
            <div class="box box3 span-2">
                <h3>Box 3 - Spans 2 Columns</h3>
                <p>This box spans across two columns</p>
            </div>
            <div class="box box4">
                <h3>Box 4</h3>
                <p>Content area 4</p>
            </div>
        </main>
    </div>
</body>
</html>
