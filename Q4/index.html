<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4: Multi-API Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5em;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #ffc107;
            display: none;
        }
        .warning.show {
            display: block;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card.users {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stat-card.orders {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .stat-card.products {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .stat-label {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 48px;
            font-weight: bold;
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s ease-in-out infinite;
            border-radius: 10px;
            height: 100px;
        }
        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Multi-API Dashboard</h1>
        <div class="warning" id="warning">
            ⚠️ Some data could not be loaded.
        </div>
        <div class="dashboard" id="dashboard">
            <div class="stat-card users">
                <div class="stat-label">Total Users</div>
                <div class="stat-value" id="usersCount">
                    <div class="skeleton"></div>
                </div>
            </div>
            <div class="stat-card orders">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="ordersCount">
                    <div class="skeleton"></div>
                </div>
            </div>
            <div class="stat-card products">
                <div class="stat-label">Total Products</div>
                <div class="stat-value" id="productsCount">
                    <div class="skeleton"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3004';

        function loadDashboard() {
            const usersPromise = fetch(`${API_BASE}/users`).then(res => res.ok ? res.json() : Promise.reject());
            const ordersPromise = fetch(`${API_BASE}/orders`).then(res => res.ok ? res.json() : Promise.reject());
            const productsPromise = fetch(`${API_BASE}/products`).then(res => res.ok ? res.json() : Promise.reject());

            Promise.all([usersPromise, ordersPromise, productsPromise])
                .then(([users, orders, products]) => {
                    document.getElementById('usersCount').textContent = users.length;
                    document.getElementById('ordersCount').textContent = orders.length;
                    document.getElementById('productsCount').textContent = products.length;
                    document.getElementById('warning').classList.remove('show');
                })
                .catch(error => {
                    console.error('Error loading dashboard:', error);
                    document.getElementById('warning').classList.add('show');
                    
                    // Try to show partial data if available
                    usersPromise.then(users => {
                        document.getElementById('usersCount').textContent = users.length;
                    }).catch(() => {
                        document.getElementById('usersCount').textContent = 'N/A';
                    });
                    
                    ordersPromise.then(orders => {
                        document.getElementById('ordersCount').textContent = orders.length;
                    }).catch(() => {
                        document.getElementById('ordersCount').textContent = 'N/A';
                    });
                    
                    productsPromise.then(products => {
                        document.getElementById('productsCount').textContent = products.length;
                    }).catch(() => {
                        document.getElementById('productsCount').textContent = 'N/A';
                    });
                });
        }

        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
</html>
