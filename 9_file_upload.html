<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload Form</title>
  </head>
  <body>
    <h1>File Upload</h1>

    <form action="#" method="post" enctype="multipart/form-data">
      <fieldset>
        <legend>Upload Your Image</legend>

        <!-- File upload input with accept attribute -->
        <label for="imagefile">Select Image File:</label><br />
        <input
          type="file"
          id="imagefile"
          name="imagefile"
          accept=".jpg,.jpeg,.png"
          required
        /><br /><br />

        <!-- Submit button -->
        <input type="submit" value="Upload Image" />
      </fieldset>
    </form>

    <!-- Note about allowed file types -->
    <p>
      <strong>Note:</strong> Only .jpg and .png image files are allowed. Please
      ensure your file is in one of these formats before uploading.
    </p>

    <p><em>Accepted file types: JPG, JPEG, PNG</em></p>
  </body>
</html>
