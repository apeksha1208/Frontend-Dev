<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="question9.css">
</head>
<body>
    <header>
        <h1>Outline and Focus Styling Form</h1>
    </header>
    
    <main>
        <section class="form-section">
            <h2>Contact Form</h2>
            <p class="form-description">Please fill out the form below. Notice how the outline changes when you focus on each field.</p>
            
            <form class="contact-form">
                <!-- Text Input -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
                
                <!-- Textarea -->
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Enter your message here..." required></textarea>
                </div>
                
                <!-- Number Input -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                </div>
                
                <!-- Submit Button -->
                <div class="form-group">
                    <button type="submit">Submit Form</button>
                </div>
            </form>
        </section>
        
        <section class="outline-demo">
            <h2>Different Outline Styles</h2>
            <div class="outline-examples">
                <div class="outline-box outline-solid">
                    <p>Solid Outline</p>
                </div>
                
                <div class="outline-box outline-dashed">
                    <p>Dashed Outline</p>
                </div>
                
                <div class="outline-box outline-dotted">
                    <p>Dotted Outline</p>
                </div>
                
                <div class="outline-box outline-double">
                    <p>Double Outline</p>
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>Outline and Focus Styling Form - CSS Practice</p>
    </footer>
</body>
</html>
