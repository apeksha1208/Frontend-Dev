<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Product List Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #productInput {
      padding: 8px;
      width: 250px;
    }

    #addBtn {
      padding: 8px 12px;
      margin-left: 5px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: #f2f2f2;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      margin-left: 5px;
      cursor: pointer;
    }

    .edit-input {
      width: 60%;
      padding: 5px;
    }
  </style>
</head>
<body>

  <h2>Dynamic Product List Manager</h2>

  <input type="text" id="productInput" placeholder="Enter product name">
  <button id="addBtn">Add</button>

  <ul id="productList"></ul>

  <script src="DynamicProduct.js"></script>
</body>
</html>
