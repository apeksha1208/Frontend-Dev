<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Gallery Modal</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  /* Image Grid */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .gallery img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    cursor: pointer;
    border-radius: 6px;
    transition: transform 0.3s;
  }

  .gallery img:hover {
    transform: scale(1.05);
  }

  /* Modal Background */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
  }

  /* Modal Box */
  .modal-content {
    background: white;
    padding: 10px;
    border-radius: 8px;
    max-width: 600px;
    width: 90%;
  }

  .modal-content img {
    width: 100%;
    border-radius: 6px;
  }
</style>
</head>

<body>

<h2>Image Gallery with Modal Preview</h2>

<div class="gallery">
  <img src="https://picsum.photos/seed/1/300" alt="">
  <img src="https://picsum.photos/seed/2/300" alt="">
  <img src="https://picsum.photos/seed/3/300" alt="">
  <img src="https://picsum.photos/seed/4/300" alt="">
  <img src="https://picsum.photos/seed/5/300" alt="">
  <img src="https://picsum.photos/seed/6/300" alt="">
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content" id="modalBox">
    <img id="modalImg" src="" alt="">
  </div>
</div>

<script src="imageGallery.js"></script>
</body>
</html>
