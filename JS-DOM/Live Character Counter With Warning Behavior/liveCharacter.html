<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Character Counter</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  textarea {
    width: 300px;
    height: 120px;
    padding: 10px;
    font-size: 16px;
  }

  #counter {
    font-size: 18px;
    margin-top: 10px;
    font-weight: bold;
  }

  .yellow {
    color: #d1a200; /* yellow */
  }

  .red {
    color: red;
  }

  #resetBtn {
    margin-top: 15px;
    padding: 8px 15px;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>

<h2>Live Character Counter</h2>

<textarea id="textBox" placeholder="Start typing..."></textarea>

<div id="counter">Remaining: 100</div>

<button id="resetBtn">Reset</button>

<script src="liveCharacter.js"></script>

</body>
</html>
