<!DOCTYPE html>
<html lang="en">
<head>

    <title>Photo Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>

        <h1>Photo Gallery</h1>

            <figure>

            </figure>
            <figure>
                <img src="https://via.placeholder.com/300x200" alt="Photo 4">
                <figcaption>Mountain Range</figcaption>
            </figure>
            <figure>
                <img src="https://via.placeholder.com/300x200" alt="Photo 5">
                <figcaption>Forest Path</figcaption>
            </figure>
            <figure>
                <img src="https://via.placeholder.com/300x200" alt="Photo 6">

            </figure>

</html>
