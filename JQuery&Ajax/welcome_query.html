<div id="greet"></div>
<button id="change">Change Greeting</button>
<button id="toggle">Toggle Welcome</button>

<script>
$(document).ready(function(){

    // 1. Greeting based on time
    let h = new Date().getHours();
    let greet = "Good Evening";
    if(h < 12) greet = "Good Morning";
    else if(h < 17) greet = "Good Afternoon";
    $("#greet").text(greet);

    // 2. Change greeting to quote
    $("#change").click(function(){
        $("#greet").text("Believe in yourself!");
    });

    // 3. Toggle visibility
    $("#toggle").click(function(){
        $("#greet").toggle();
    });

    // 4. Alert when greeting clicked
    $("#greet").click(function(){
        alert("Greeting clicked!");
    });

});
</script>
