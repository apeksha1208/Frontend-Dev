<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Get In Touch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-container">
      <header class="header">
        <div class="container">
          <h1 class="main-title">Get In Touch</h1>
          <p class="subtitle">We'd love to hear from you. Send us a message!</p>
        </div>
      </header>

      <main class="main-content">
        <div class="container">
          <div class="contact-wrapper">
            <div class="contact-info">
              <h2 class="info-title">Contact Information</h2>
              <div class="info-item">
                <h3 class="info-label">Email</h3>
                <p class="info-text">hello@company.com</p>
              </div>
              <div class="info-item">
                <h3 class="info-label">Phone</h3>
                <p class="info-text">+1 (555) 123-4567</p>
              </div>
              <div class="info-item">
                <h3 class="info-label">Address</h3>
                <p class="info-text">
                  123 Business Street<br />
                  Suite 100<br />
                  New York, NY 10001
                </p>
              </div>
            </div>

            <form class="contact-form" action="#" method="post">
              <h2 class="form-title">Send us a Message</h2>

              <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  class="form-input"
                  placeholder="Enter your full name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  placeholder="Enter your email address"
                  required
                />
              </div>

              <div class="form-group">
                <label for="subject" class="form-label">Subject</label>
                <input
                  type="text"
                  id="subject"
                  name="subject"
                  class="form-input"
                  placeholder="What's this about?"
                  required
                />
              </div>

              <div class="form-group">
                <label for="message" class="form-label">Message</label>
                <textarea
                  id="message"
                  name="message"
                  class="form-textarea"
                  rows="6"
                  placeholder="Tell us more about your inquiry..."
                  required
                ></textarea>
              </div>

              <button type="submit" class="form-button">Send Message</button>
            </form>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="container">
          <p class="footer-text">
            &copy; 2024 Our Company. We'll get back to you within 24 hours.
          </p>
        </div>
      </footer>
    </div>
  </body>
</html>
