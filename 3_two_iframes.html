<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Iframes Layout</title>
  </head>
  <body>
    <h1>My Personal Pages</h1>

    <!-- First iframe displaying introduction page -->
    <h2>Introduction Page</h2>
    <iframe
      src="4_introduction.html"
      width="100%"
      height="300"
      title="Introduction Page"
      frameborder="1"
    >
    </iframe>

    <!-- Second iframe displaying hobby page -->
    <h2>My Favorite Hobby</h2>
    <iframe
      src="4_hobby.html"
      width="100%"
      height="300"
      title="Hobby Page"
      frameborder="1"
    >
    </iframe>

    <p>
      These iframes display my introduction and hobby pages in a balanced
      layout.
    </p>
  </body>
</html>
