<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">MyWebsite</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    
    <main>
        <article>
            <h1 class="animated-title">Welcome to Our Website</h1>
            <div class="boxes">
                <div class="box">
                    <h3>Box 1</h3>
                    <p>Content for box 1</p>
                </div>
                <div class="box">
                    <h3>Box 2</h3>
                    <p>Content for box 2</p>
                </div>
                <div class="box">
                    <h3>Box 3</h3>
                    <p>Content for box 3</p>
                </div>
            </div>
        </article>
        
        <aside>
            <h2>Sidebar</h2>
            <ul>
                <li>Recent Posts</li>
                <li>Categories</li>
                <li>Archives</li>
                <li>Tags</li>
            </ul>
        </aside>
    </main>
    
    <footer>
        <p>&copy; 2024 MyWebsite. All rights reserved.</p>
    </footer>
</body>
</html>
