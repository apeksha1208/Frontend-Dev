<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Mini UI Layout</title>
    <link rel="stylesheet" href="mini-ui.css">
</head>
<body>
    <header class="main-header">
        <h1>Welcome to Our Platform</h1>
        <nav>
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link">About</a>
            <a href="#" class="nav-link">Contact</a>
        </nav>
    </header>

    <main>
        <section class="main-card">
            <h2>Get Started</h2>
            
            <!-- Form Section -->
            <form class="main-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Enter your message" required></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>
            </form>

            <!-- Image Section -->
            <div class="image-section">
                <figure>
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=250&fit=crop" alt="Beautiful landscape">
                    <figcaption>Beautiful Landscape</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 CSS Classes Practice. All rights reserved.</p>
        <p>Built with HTML5 and CSS3</p>
    </footer>
</body>
</html>
