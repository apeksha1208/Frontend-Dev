<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="tooltip.css">
</head>
<body>
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements below to see tooltips appear</p>
    </header>

    <main>
        <section class="tooltip-container">
            <!-- Icon Tooltip 1 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger" data-tooltip="This is a helpful tooltip!">ℹ️</span>
            </div>

            <!-- Icon Tooltip 2 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger" data-tooltip="Click here to save your work">💾</span>
            </div>

            <!-- Icon Tooltip 3 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger" data-tooltip="Send this message">✉️</span>
            </div>

            <!-- Text Tooltip 1 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger" data-tooltip="Learn more about CSS">CSS Guide</span>
            </div>

            <!-- Text Tooltip 2 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger" data-tooltip="Visit our documentation">Documentation</span>
            </div>

            <!-- Text Tooltip 3 -->
            <div class="tooltip-wrapper">
                <span class="tooltip-trigger" data-tooltip="Get help and support">Support</span>
            </div>

            <!-- Button Tooltip -->
            <div class="tooltip-wrapper">
                <button class="tooltip-trigger" data-tooltip="Submit your form">Submit</button>
            </div>

            <!-- Link Tooltip -->
            <div class="tooltip-wrapper">
                <a href="#" class="tooltip-trigger" data-tooltip="Navigate to the home page">Home</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 CSS Classes Practice</p>
    </footer>
</body>
</html>
