<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="image-showcase.css">
</head>
<body>
    <header>
        <h1>Image Showcase Gallery</h1>
        <p>Hover over images to see the effect</p>
    </header>

    <main>
        <section class="gallery">
            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop" alt="Mountain landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain Landscape</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=400&h=300&fit=crop" alt="Ocean view">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean View</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400&h=300&fit=crop" alt="Forest path">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest Path</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=400&h=300&fit=crop" alt="Desert dunes">
                    <div class="overlay"></div>
                </div>
                <figcaption>Desert Dunes</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400&h=300&fit=crop" alt="Sunset sky">
                    <div class="overlay"></div>
                </div>
                <figcaption>Sunset Sky</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop" alt="Mountain peaks">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain Peaks</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 CSS Classes Practice</p>
    </footer>
</body>
</html>
