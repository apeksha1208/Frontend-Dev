<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Page</title>
    <link rel="stylesheet" href="ui-components.css">
</head>
<body>
    <header>
        <h1>User Interface Components</h1>
        <p>A collection of interactive UI elements</p>
    </header>

    <main>
        <section class="ui-container">
            <div class="components-card">
                <!-- Search Bar -->
                <div class="component-section">
                    <h2>Search Bar</h2>
                    <div class="search-wrapper">
                        <input type="search" class="search-input" placeholder="Search...">
                        <button class="search-button">🔍</button>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="component-section">
                    <h2>Buttons</h2>
                    <div class="buttons-wrapper">
                        <button class="ui-btn ui-btn-primary">Primary</button>
                        <button class="ui-btn ui-btn-secondary">Secondary</button>
                        <button class="ui-btn ui-btn-outline">Outline</button>
                    </div>
                </div>

                <!-- Dropdown Menu -->
                <div class="component-section">
                    <h2>Dropdown Menu</h2>
                    <div class="dropdown-wrapper">
                        <button class="dropdown-trigger">Select Option ▼</button>
                        <div class="dropdown-menu">
                            <a href="#" class="dropdown-item">Option 1</a>
                            <a href="#" class="dropdown-item">Option 2</a>
                            <a href="#" class="dropdown-item">Option 3</a>
                            <a href="#" class="dropdown-item">Option 4</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 CSS Classes Practice</p>
    </footer>
</body>
</html>
